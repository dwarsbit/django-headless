[project]
name = "django-headless"
version = "1.1.1"
description = "Automagically create a REST API for your Django models"
authors = [
    { name = "Leon van der Grient", email = "leon@dwarsbit.nl" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<7.0",
    "djangorestframework>=3.18,<4.0",
    "drf-flex-fields>=1.0,<2.0",
    "rich>=14",
]
keywords = ["django", "rest", "api", "headless", "cms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
schema = [
    "uritemplate>=4",
    "inflection>=0.5",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://djangoheadless.org"
Documentation = "https://djangoheadless.org/docs/intro"
Source = "https://github.com/dwarsbit/django-headless"
Issues = "https://github.com/dwarsbit/django-headless/issues"
Changelog = "https://github.com/dwarsbit/django-headless/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "headless"}]

[tool.poetry.group.dev.dependencies]
black = "26.3.1"
Django= "6.1.2"
djangorestframework = "3.18.3"
djangorestframework-stubs = "3.16.8"
pytest = "9.0.2"
"pytest-django" = "4.12.0"
pytest-cov = "^7.1.0"
uritemplate = "^4.1"
inflection = "^0.5"
pyyaml = "^6.0"
openapi-spec-validator = { version = "^0.7", python = ">=3.12,<4.0" }

[tool.black]
line-length = 120
target-version = ["py312"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
